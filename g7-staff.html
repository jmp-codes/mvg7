<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Office - G7 Marine Transport</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preload" as="image" href="assets/logo.png">
    <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/booking.css">
  <link rel="stylesheet" href="css/office.css">
  <link rel="stylesheet" href="css/office-bookings.css">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    /* Loading screen: inline so it paints before the stylesheets arrive */
    #boot{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;transition:opacity .45s ease,visibility .45s}
    #boot.done{opacity:0;visibility:hidden;pointer-events:none}
    #boot img{width:min(46vw,190px);height:auto;animation:bootPulse 1.6s ease-in-out infinite}
    #boot .bar{width:min(52vw,200px);height:4px;border-radius:4px;background:#e3e9f3;overflow:hidden}
    #boot .bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#0a2f7a,#e8a33a);animation:bootBar 1.15s ease-in-out infinite}
    #boot p{margin:0;font:600 .8rem/1 system-ui,sans-serif;letter-spacing:.18em;color:#0a2f7a;text-transform:uppercase}
    @keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes bootBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){#boot img,#boot .bar i{animation:none}}
  </style>
</head>
<body class="is-office">
  <div id="boot" role="status" aria-live="polite">
    <img src="assets/logo.png" alt="MV Group 7">
    <div class="bar"><i></i></div>
    <p>Loading</p>
  </div>
  <script>
    // Hide the loading screen once everything (hero photo, fonts, scripts) has loaded.
    // A 600 ms minimum avoids a flash; an 8 s cap means it can never get stuck.
    (function () {
      var t0 = Date.now(), b;
      function hide() {
        b = b || document.getElementById('boot'); if (!b) return;
        var wait = Math.max(0, 600 - (Date.now() - t0));
        setTimeout(function () { b.classList.add('done'); setTimeout(function () { b.remove(); }, 600); }, wait);
      }
      window.addEventListener('load', hide);
      setTimeout(hide, 8000);
    })();
  </script>
  <header class="topbar no-print">
    
    <a class="brand" href="index.html#/home" aria-label="G7 Marine Transport home">
      <svg class="logo-mark" viewBox="0 0 80 40" aria-hidden="true">
        <path d="M2 30c10-8 18-8 28-2s20 6 30-2" fill="none" stroke="#1b8fc7" stroke-width="3" stroke-linecap="round"/>
        <path d="M6 35c10-6 18-6 28-1s20 5 32-1" fill="none" stroke="#0a2f7a" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="26" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="26" fill="#0a2f7a">G7</text>
      </svg>
      <span class="brand-text"><b>G7 MARINE</b><b>TRANSPORT</b></span>
      <img class="logo-img" src="assets/logo.png" alt="G7 Marine Transport" onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()">
    </a>
    <div class="nav-cta" style="display:flex;margin-left:auto">
      <a class="btn-outline" href="index.html#/home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Back to website</span></a>
    </div>
  </header>

  <main id="view"></main>

  <!-- Load order matters: each file only depends on the ones above it. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/seatmap.js"></script>
  <script src="js/logo-data.js"></script>
  <script src="js/ticket.js"></script>
  <script src="js/ticketimg.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/office-pay.js"></script>
  <script src="js/office-bookings.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/office-app.js"></script>
</body>
</html>
